<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">ClauJev</title>
  <desc id="d">Claude Code faz o trabalho. Jev confere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#1e2233"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8875f"/>
      <stop offset="1" stop-color="#c8613b"/>
    </linearGradient>
    <linearGradient id="jev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb4e8"/>
      <stop offset="1" stop-color="#3b7fc8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#2c3247" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200"/>
    <path d="M150 0V360M300 0V360M450 0V360M600 0V360M750 0V360M900 0V360M1050 0V360"/>
  </g>

  <!-- Claude Code: quem faz -->
  <g transform="translate(110 110)">
    <rect width="250" height="140" rx="18" fill="url(#claude)"/>
    <text x="125" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#fff">Claude Code</text>
    <text x="125" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#fff" opacity=".9">faz o trabalho</text>
  </g>

  <!-- setas de ida e volta -->
  <g stroke="#9aa3bd" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M380 160H520"/><path d="M508 150l12 10-12 10"/>
    <path d="M520 200H380"/><path d="M392 190l-12 10 12 10"/>
  </g>
  <text x="450" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#9aa3bd">hooks</text>
  <text x="450" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#9aa3bd">sinal ~400 ms</text>

  <!-- Jev: quem confere -->
  <g transform="translate(540 110)">
    <rect width="250" height="140" rx="18" fill="url(#jev)"/>
    <text x="125" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#fff">Jev</text>
    <text x="125" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#fff" opacity=".9">confere</text>
  </g>

  <!-- nome -->
  <text x="840" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" fill="#f3f4f8">Clau<tspan fill="#5fb4e8">Jev</tspan></text>
  <text x="842" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#b8bfd3">um segundo par de olhos</text>
  <text x="842" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#b8bfd3">para o seu agente</text>
</svg>
