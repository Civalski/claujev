name: test
# Roda no runner self-hosted da maquina Linux do autor, nunca em runner hospedado.
# Repositorio publico: sem gatilho de pull_request, para PR de fork nao rodar codigo
# na maquina. Antes de aceitar um PR, rode `npm test` localmente.
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, claujev]
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check plugins/claujev/hooks/claujev.mjs
      - run: node --check install.mjs
      - run: node --test test/claujev.test.mjs
